name: 🏗️ ONNX Runtime Binaries
on:
  workflow_dispatch:
    inputs:
      onnxruntime-tag:
        type: string
        description: "ONNX Runtime tag to build"
        default: "v1.23.2"
      apple-deploy-target:
        type: string
        description: "Minimum macOS version for Apple builds"
        default: "12.0"
  # Narrow on purpose: this occupies a self-hosted Mac for ~30m. Also the only way to trigger a run
  # while the workflow isn't on the default branch, since workflow_dispatch requires it to be there.
  push:
    paths:
      - '.github/workflows/onnxruntime-build.yml'
      - 'tests/custom_build.rs'
permissions:
  contents: read
concurrency:
  group: '${{ github.workflow }} @ ${{ github.ref }}'
  cancel-in-progress: true
env:
  ORT_TAG: ${{ inputs.onnxruntime-tag || 'v1.23.2' }}
  APPLE_DEPLOY_TARGET: ${{ inputs.apple-deploy-target || '12.0' }}
  RUST_BACKTRACE: 1
jobs:
  build:
    name: ${{ matrix.target.name }}
    # Labels come through as a JSON string rather than a YAML sequence so that a multi-label
    # self-hosted selector survives being nested inside a matrix object.
    runs-on: ${{ fromJSON(matrix.target.runner) }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        target:
          # Built universal on arm64 rather than natively per-arch. Intel runners are slow, and a
          # pure x86_64 cross build leaves an x86_64-only protoc that the build then has to execute,
          # which needs Rosetta - not in any runner image manifest, and something Apple is winding
          # down. A universal protoc carries an arm64 slice and runs natively. The resulting fat
          # archives link for both aarch64- and x86_64-apple-darwin, so one artifact serves both.
          - name: macOS (universal2)
            runner: '[ "self-hosted", "macOS", "ARM64", "ane" ]'
            triple: universal2-apple-darwin
            platform: MacOS
            arch: 'arm64;x86_64'
            expect-archs: 'arm64,x86_64'
            ep-args: '--use_coreml'
            # ccache only pays off where the disk persists between runs, i.e. self-hosted.
            cache-args: '--use_cache'
            features: 'std,ndarray,coreml'
          - name: Windows (x64)
            runner: '[ "namespace-profile-windows-16-core" ]'
            triple: x86_64-pc-windows-msvc
            platform: Windows
            ep-args: ''
            cache-args: ''
            features: 'std,ndarray'
          - name: Linux (x64)
            runner: '[ "namespace-profile-ubuntu-8-core" ]'
            triple: x86_64-unknown-linux-gnu
            platform: Linux
            ep-args: ''
            cache-args: ''
            features: 'std,ndarray'
    steps:
      # Default clean:true matters on the self-hosted runner - it clears the previous run's
      # onnxruntime tree, which is several GB.
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Linux toolchain
        if: matrix.target.platform == 'Linux'
        run: |
          # Pinned rather than taken from the image so the cmake >=3.28 floor is explicit; 24.04
          # ships 3.28.3, which only just clears it.
          python -m pip install --upgrade 'cmake>=3.28'
          cmake --version
          cc --version | head -1
          # Informational: this is the glibc floor of the resulting artifact.
          ldd --version | head -1

      - name: Set up macOS toolchain
        if: matrix.target.platform == 'MacOS'
        run: |
          brew list cmake >/dev/null 2>&1 || brew install cmake
          brew list ccache >/dev/null 2>&1 || brew install ccache
          ccache --max-size=20G
          cmake --version
          # Applies to the ONNX Runtime build and to rustc, which must agree on the target.
          echo "MACOSX_DEPLOYMENT_TARGET=$APPLE_DEPLOY_TARGET" >> "$GITHUB_ENV"

      - name: Clone ONNX Runtime
        run: |
          # Explicit, in case checkout's clean is ever disabled - a stale tree would fail the clone.
          rm -rf onnxruntime
          git clone https://github.com/microsoft/onnxruntime --recursive --single-branch --depth 1 --branch "$ORT_TAG"

      - name: Build ONNX Runtime
        working-directory: onnxruntime
        run: |
          args=(
            --build_dir "build/${{ matrix.target.platform }}"
            --config Release
            --parallel
            --update --build
            --skip_tests
            --skip_submodule_sync
            --compile_no_warning_as_error
          )
          # --skip_tests only skips *running* them. The test targets still compile, and they pull in
          # APIs unavailable below macOS 13.4, which is why upstream raised its own floor rather than
          # fix the build (microsoft/onnxruntime#24277, #25616). Dropping them is what makes a 12.0
          # build possible at all, and it takes a large chunk off every platform's build time.
          args+=( --cmake_extra_defines onnxruntime_BUILD_UNIT_TESTS=OFF )

          if [[ "${{ matrix.target.platform }}" == "MacOS" ]]; then
            # --apple_deploy_target is ignored unless --macos/--ios is also passed, and those force an
            # Xcode-generator shared framework build. Set the CMake variable directly instead.
            args+=( --cmake_extra_defines "CMAKE_OSX_DEPLOYMENT_TARGET=$APPLE_DEPLOY_TARGET" )
            args+=( --cmake_extra_defines "CMAKE_OSX_ARCHITECTURES=${{ matrix.target.arch }}" )
          fi

          # Called directly rather than through build.sh/build.bat, which inject --use_telemetry.
          python tools/ci_build/build.py "${args[@]}" \
            ${{ matrix.target.ep-args }} ${{ matrix.target.cache-args }}

      - name: ccache stats
        if: matrix.target.cache-args != ''
        run: |
          {
            echo '```'
            ccache --show-stats || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A silently-ignored deployment target yields an artifact that looks fine and only fails on a
      # real macOS 12 machine, so gate on it here.
      - name: Verify deployment target
        if: matrix.target.platform == 'MacOS'
        working-directory: onnxruntime/build/MacOS/Release
        run: |
          # Anything at or below the target is fine; only a higher floor breaks macOS 12.
          above() { [ "$(printf '%s\n%s\n' "$APPLE_DEPLOY_TARGET" "$1" | sort -V | tail -1)" != "$APPLE_DEPLOY_TARGET" ]; }
          minos_of() { otool -l "$1" 2>/dev/null | awk '/^ *minos /{print $2}' | sort -V | tail -1 || true; }

          highest=$(find . -name '*.a' -exec otool -l {} + 2>/dev/null | awk '/^ *minos /{print $2}' | sort -V | tail -1 || true)
          echo "highest minos across all objects: ${highest:-<none>}"
          if [ -z "$highest" ]; then
            echo "::error::no LC_BUILD_VERSION load commands found - cannot verify deployment target"
            exit 1
          fi

          fail=0
          while IFS= read -r lib; do
            m=$(minos_of "$lib")
            [ -n "$m" ] || continue
            if above "$m"; then
              echo "::error::$lib requires macOS $m, above the requested $APPLE_DEPLOY_TARGET"
              fail=1
            fi
          done < <(find . -name '*.a')
          [ "$fail" -eq 0 ] || exit 1

          probe=$(find . -name 'libonnxruntime_common.a' | head -1)
          if [ -z "$probe" ]; then
            echo "::error::libonnxruntime_common.a not found - build layout is not what packaging expects"
            exit 1
          fi
          archs=$(lipo -archs "$probe" | tr ' ' '\n' | sort -u | paste -sd, -)
          echo "archs: $archs"
          expected='${{ matrix.target.expect-archs }}'
          [ "$archs" = "$expected" ] || { echo "::error::expected $expected, got $archs"; exit 1; }

      - name: Package
        run: |
          src="onnxruntime/build/${{ matrix.target.platform }}/Release"
          # ort's static linking expects the archives exactly where the build tree leaves them
          # (component libs at the root, vendored deps under _deps/), so preserve relative paths and
          # ship nothing else. Consumers point ORT_LIB_LOCATION at the extracted directory.
          ( cd "$src" && find . \( -name '*.a' -o -name '*.lib' \) -print > "$GITHUB_WORKSPACE/libs.txt" )
          count=$(wc -l < libs.txt)
          echo "packaging $count libraries"
          # An empty archive still uploads cleanly, so fail loudly instead.
          [ "$count" -gt 0 ] || { echo "::error::no libraries found under $src"; exit 1; }
          tar -czf "onnxruntime-$ORT_TAG-${{ matrix.target.triple }}.tgz" -C "$src" -T libs.txt
          ls -la onnxruntime-*.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: onnxruntime-${{ env.ORT_TAG }}-${{ matrix.target.triple }}
          path: onnxruntime-${{ env.ORT_TAG }}-${{ matrix.target.triple }}.tgz
          if-no-files-found: error

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target.platform == 'MacOS' && 'x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2.7.8

      - name: Smoke test
        run: |
          ORT_LIB_LOCATION="$PWD/onnxruntime/build/${{ matrix.target.platform }}/Release" \
            cargo test -p ort --no-default-features --features ${{ matrix.target.features }} \
            --test custom_build -- --nocapture --test-threads 1
        env:
          RUSTFLAGS: ${{ matrix.target.platform == 'MacOS' && '-Clink-arg=-fapple-link-rtlib' || '' }}

      # The x86_64 slice can't be executed on an arm64 runner, so prove it at least links. Intel
      # runtime validation has to happen on real macOS 12 hardware regardless - a 12.0 deployment
      # target exercised on macOS 15 proves very little.
      - name: Verify x86_64 slice links
        if: matrix.target.platform == 'MacOS'
        run: |
          ORT_LIB_LOCATION="$PWD/onnxruntime/build/MacOS/Release" \
            cargo test -p ort --no-default-features --features ${{ matrix.target.features }} \
            --test custom_build --target x86_64-apple-darwin --no-run
        env:
          RUSTFLAGS: '-Clink-arg=-fapple-link-rtlib'

      # Reclaims several GB on the self-hosted runner. Left in place on failure so the tree can be
      # inspected; the next run's checkout clean will remove it.
      - name: Clean up
        if: success()
        run: rm -rf onnxruntime

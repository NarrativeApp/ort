name: 🏗️ ONNX Runtime Binaries
on:
  workflow_dispatch:
    inputs:
      onnxruntime-tag:
        type: string
        description: "ONNX Runtime tag to build"
        default: "v1.23.2"
      apple-deploy-target:
        type: string
        description: "Minimum macOS version for Apple builds"
        default: "12.0"
  # Narrow on purpose: this occupies a self-hosted Mac for ~30m. Also the only way to trigger a run
  # while the workflow isn't on the default branch, since workflow_dispatch requires it to be there.
  push:
    paths:
      - '.github/workflows/onnxruntime-build.yml'
      - 'tests/custom_build.rs'
permissions:
  contents: read
concurrency:
  group: '${{ github.workflow }} @ ${{ github.ref }}'
  cancel-in-progress: true
env:
  ORT_TAG: ${{ inputs.onnxruntime-tag || 'v1.23.2' }}
  APPLE_DEPLOY_TARGET: ${{ inputs.apple-deploy-target || '12.0' }}
  RUST_BACKTRACE: 1
jobs:
  build:
    name: ${{ matrix.target.name }}
    # Labels come through as a JSON string rather than a YAML sequence so that a multi-label
    # self-hosted selector survives being nested inside a matrix object.
    runs-on: ${{ fromJSON(matrix.target.runner) }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        target:
          # Single-arch, not universal2. universal2 avoided needing Rosetta for protoc, but it is a
          # configuration nobody upstream builds and it broke in four separate ways: per-arch mlas
          # targets missing from ORT's export set; cpuinfo silently not built because
          # onnxruntime_target_platform stops matching a single arch; the per-arch mlas kernel
          # archives (libonnxruntime_mlas_arm64/_x86_64) not being linked by ort-sys, leaving NEON
          # symbols undefined; plus a stream of ld arch-mismatch warnings. Single-arch produces one
          # libonnxruntime_mlas.a and does build cpuinfo, matching what upstream ORT and ort test.
          #
          # x86_64 is deferred, not dropped - it needs a host-arch protoc, which upstream solves with
          # --use_vcpkg. The Rosetta probe below gathers the data to decide how.
          #
          # On Namespace rather than the self-hosted fleet: every org runner group is
          # allows_public_repositories=false, and this repo is a public fork whose visibility can't
          # be changed (fork visibility is tied to the upstream network). Move back to
          # [self-hosted, macOS, ARM64, ane] if that policy is ever relaxed - the disk persists
          # there, so --use_cache becomes worth adding back.
          - name: macOS (arm64)
            runner: '[ "namespace-profile-macos-14" ]'
            triple: aarch64-apple-darwin
            platform: MacOS
            arch: 'arm64'
            expect-archs: 'arm64'
            ep-args: '--use_coreml'
            cache-args: ''
            unit-tests: 'OFF'
            features: 'std,ndarray,coreml'
          # Unit tests stay ON here purely to get re2 built. The VS generator maps
          # `cmake --build --target re2` to a bare re2.vcxproj in the build root, but the project
          # lives under _deps/, so it fails with MSB1009. Building the tests links re2::re2 and
          # produces it as a side effect - that's upstream's own configuration, at the cost of a
          # slower build. Windows has no macOS-style availability problem, so nothing else objects.
          - name: Windows (x64)
            runner: '[ "namespace-profile-windows-16-core" ]'
            triple: x86_64-pc-windows-msvc
            platform: Windows
            ep-args: ''
            cache-args: ''
            unit-tests: 'ON'
            features: 'std,ndarray'
          - name: Linux (x64)
            runner: '[ "namespace-profile-ubuntu-8-core" ]'
            triple: x86_64-unknown-linux-gnu
            platform: Linux
            ep-args: ''
            cache-args: ''
            unit-tests: 'OFF'
            features: 'std,ndarray'
    steps:
      # Default clean:true matters on the self-hosted runner - it clears the previous run's
      # onnxruntime tree, which is several GB.
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Linux toolchain
        if: matrix.target.platform == 'Linux'
        run: |
          # Pinned rather than taken from the image so the cmake >=3.28 floor is explicit; 24.04
          # ships 3.28.3, which only just clears it.
          python -m pip install --upgrade 'cmake>=3.28'
          echo "CMAKE=$(command -v cmake)" >> "$GITHUB_ENV"
          cmake --version
          cc --version | head -1
          # Informational: this is the glibc floor of the resulting artifact.
          ldd --version | head -1

      - name: Set up macOS toolchain
        if: matrix.target.platform == 'MacOS'
        run: |
          # The runner image ships cmake 4.x, which has removed compatibility with
          # cmake_minimum_required < 3.5 - and psimd, pulled in on ARM, still declares that. ORT
          # 1.23.2 predates CMake 4, so pin below it rather than chase policy flags one at a time.
          python -m pip install --upgrade 'cmake<4'
          echo "CMAKE=$(command -v cmake)" >> "$GITHUB_ENV"
          cmake --version
          xcodebuild -version | head -1
          # Informational, for the deferred x86_64 job: a plain x86_64 cross build produces an
          # x86_64-only protoc that the build then has to execute. If Rosetta is present that works
          # with no extra flags; if not, x86_64 needs --use_vcpkg or an explicit host protoc.
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "rosetta: available (plain x86_64 cross build should work)"
          else
            echo "rosetta: NOT available (x86_64 will need --use_vcpkg or --path_to_protoc_exe)"
          fi
          # Applies to the ONNX Runtime build and to rustc, which must agree on the target.
          echo "MACOSX_DEPLOYMENT_TARGET=$APPLE_DEPLOY_TARGET" >> "$GITHUB_ENV"

      - name: Clone ONNX Runtime
        run: |
          # Explicit, in case checkout's clean is ever disabled - a stale tree would fail the clone.
          rm -rf onnxruntime
          git clone https://github.com/microsoft/onnxruntime --recursive --single-branch --depth 1 --branch "$ORT_TAG"

      # ORT skips its install(EXPORT) block only for static+webgpu builds, but the same reasoning
      # applies to any static build. coreml_proto is never added to an export set (true in every
      # release through main), and universal2 additionally creates onnxruntime_mlas_arm64/_x86_64
      # which aren't either, so generate fails before anything compiles:
      #   install(EXPORT "onnxruntimeTargets" ...) includes target "onnxruntime_providers_coreml"
      #   which requires target "coreml_proto" that is not in any export set
      # Upstream only tests CoreML with --build_shared_lib, where the shared library absorbs those
      # static deps, which is why this configuration is unguarded. We link archives straight out of
      # the build tree and never consume ORT's CMake package, so widen the skip to all static builds.
      # Applied everywhere: it's inert where the export set is already consistent.
      - name: Skip ORT install(EXPORT) for static builds
        run: |
          python -c "
          import pathlib, sys
          p = pathlib.Path('onnxruntime/cmake/CMakeLists.txt')
          s = p.read_text()
          old = 'if(NOT onnxruntime_BUILD_SHARED_LIB AND onnxruntime_USE_WEBGPU)'
          new = 'if(NOT onnxruntime_BUILD_SHARED_LIB)'
          n = s.count(old)
          if n != 1: sys.exit('expected exactly 1 install(EXPORT) guard, found %d - has ORT cmake changed?' % n)
          p.write_text(s.replace(old, new, 1))
          print('patched install(EXPORT) guard')
          "

      - name: Build ONNX Runtime
        working-directory: onnxruntime
        run: |
          args=(
            --build_dir "build/${{ matrix.target.platform }}"
            --config Release
            --parallel
            --update --build
            --skip_tests
            --skip_submodule_sync
            --compile_no_warning_as_error
          )
          # --skip_tests only skips *running* them. The test targets still compile, and they pull in
          # APIs unavailable below macOS 13.4, which is why upstream raised its own floor rather than
          # fix the build (microsoft/onnxruntime#24277, #25616). Dropping them is what makes a 12.0
          # build possible at all, and it takes a large chunk off the build time.
          args+=( --cmake_extra_defines onnxruntime_BUILD_UNIT_TESTS=${{ matrix.target.unit-tests }} )

          if [[ "${{ matrix.target.platform }}" == "MacOS" ]]; then
            # --apple_deploy_target is ignored unless --macos/--ios is also passed, and those force an
            # Xcode-generator shared framework build. Set the CMake variable directly instead.
            args+=( --cmake_extra_defines "CMAKE_OSX_DEPLOYMENT_TARGET=$APPLE_DEPLOY_TARGET" )
            args+=( --cmake_extra_defines "CMAKE_OSX_ARCHITECTURES=${{ matrix.target.arch }}" )
          fi

          # $CMAKE is set by the toolchain steps where a specific cmake is required; passed
          # explicitly so PATH ordering against the image's own cmake can't decide it.
          cmake_bin="${CMAKE:-cmake}"
          "$cmake_bin" --version

          # Called directly rather than through build.sh/build.bat, which inject --use_telemetry.
          python tools/ci_build/build.py "${args[@]}" --cmake_path "$cmake_bin" \
            ${{ matrix.target.ep-args }} ${{ matrix.target.cache-args }}

          # ORT declares re2 EXCLUDE_FROM_ALL. Static component libs don't link, so with unit tests
          # off nothing in the graph ever links re2::re2 and libre2 is never produced - yet
          # onnxruntime_providers and onnxruntime_session both reference re2::RE2 symbols, so the
          # Rust link fails. Upstream's static-link CI only gets away with this because it builds the
          # tests; where we can't (macOS, and Linux for speed), build the target explicitly.
          bdir="build/${{ matrix.target.platform }}/Release"
          if [[ "${{ matrix.target.unit-tests }}" == "OFF" ]]; then
            "$cmake_bin" --build "$bdir" --target re2 --config Release
          fi

          # Assert it landed either way, so this can never silently reach the smoke test again.
          if ! find "$bdir/_deps/re2-build" \( -name 'libre2.a' -o -name 're2.lib' \) 2>/dev/null | grep -q .; then
            echo "::error::re2 was not built - onnxruntime_providers/session reference re2::RE2 and the Rust link will fail"
            exit 1
          fi

      - name: ccache stats
        if: matrix.target.cache-args != ''
        run: |
          {
            echo '```'
            ccache --show-stats || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A silently-ignored deployment target yields an artifact that looks fine and only fails on a
      # real macOS 12 machine, so gate on it here.
      - name: Verify deployment target
        if: matrix.target.platform == 'MacOS'
        working-directory: onnxruntime/build/MacOS/Release
        run: |
          # Anything at or below the target is fine; only a higher floor breaks macOS 12.
          above() { [ "$(printf '%s\n%s\n' "$APPLE_DEPLOY_TARGET" "$1" | sort -V | tail -1)" != "$APPLE_DEPLOY_TARGET" ]; }
          minos_of() { otool -l "$1" 2>/dev/null | awk '/^ *minos /{print $2}' | sort -V | tail -1 || true; }

          highest=$(find . -name '*.a' -exec otool -l {} + 2>/dev/null | awk '/^ *minos /{print $2}' | sort -V | tail -1 || true)
          echo "highest minos across all objects: ${highest:-<none>}"
          if [ -z "$highest" ]; then
            echo "::error::no LC_BUILD_VERSION load commands found - cannot verify deployment target"
            exit 1
          fi

          fail=0
          while IFS= read -r lib; do
            m=$(minos_of "$lib")
            [ -n "$m" ] || continue
            if above "$m"; then
              echo "::error::$lib requires macOS $m, above the requested $APPLE_DEPLOY_TARGET"
              fail=1
            fi
          done < <(find . -name '*.a')
          [ "$fail" -eq 0 ] || exit 1

          probe=$(find . -name 'libonnxruntime_common.a' | head -1)
          if [ -z "$probe" ]; then
            echo "::error::libonnxruntime_common.a not found - build layout is not what packaging expects"
            exit 1
          fi
          archs=$(lipo -archs "$probe" | tr ' ' '\n' | sort -u | paste -sd, -)
          echo "archs: $archs"
          expected='${{ matrix.target.expect-archs }}'
          [ "$archs" = "$expected" ] || { echo "::error::expected $expected, got $archs"; exit 1; }

      - name: Package
        run: |
          src="onnxruntime/build/${{ matrix.target.platform }}/Release"
          # ort's static linking expects the archives exactly where the build tree leaves them
          # (component libs at the root, vendored deps under _deps/), so preserve relative paths and
          # ship nothing else. Consumers point ORT_LIB_LOCATION at the extracted directory.
          ( cd "$src" && find . \( -name '*.a' -o -name '*.lib' \) -print > "$GITHUB_WORKSPACE/libs.txt" )
          count=$(wc -l < libs.txt)
          echo "packaging $count libraries"
          # An empty archive still uploads cleanly, so fail loudly instead.
          [ "$count" -gt 0 ] || { echo "::error::no libraries found under $src"; exit 1; }
          tar -czf "onnxruntime-$ORT_TAG-${{ matrix.target.triple }}.tgz" -C "$src" -T libs.txt
          ls -la onnxruntime-*.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: onnxruntime-${{ env.ORT_TAG }}-${{ matrix.target.triple }}
          path: onnxruntime-${{ env.ORT_TAG }}-${{ matrix.target.triple }}.tgz
          if-no-files-found: error

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2.7.8

      - name: Smoke test
        run: |
          ORT_LIB_LOCATION="$PWD/onnxruntime/build/${{ matrix.target.platform }}/Release" \
            cargo test -p ort --no-default-features --features ${{ matrix.target.features }} \
            --test custom_build -- --nocapture --test-threads 1
        env:
          RUSTFLAGS: ${{ matrix.target.platform == 'MacOS' && '-Clink-arg=-fapple-link-rtlib' || '' }}

      # Reclaims several GB on the self-hosted runner. Left in place on failure so the tree can be
      # inspected; the next run's checkout clean will remove it.
      - name: Clean up
        if: success()
        run: rm -rf onnxruntime
